*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;}

.wrap{max-width:900px;margin:0 auto;padding:18px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 12px;text-align:center;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s;}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(30,30,60,.12);}
.badge{width:64px;height:64px;border-radius:18px;display:inline-grid;place-items:center;color:#fff;font-size:26px;font-weight:800;margin-bottom:12px;box-shadow:0 6px 14px rgba(0,0,0,.12);}
.card .en{font-size:16px;font-weight:700;letter-spacing:.3px;}

.card .tag{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
.footer{text-align:center;color:var(--ink-soft);font-size:12.5px;margin:22px 0 30px;}

.btn{display:block;text-align:center;background:var(--brand);color:#fff;text-decoration:none;padding:14px 20px;border-radius:12px;font-size:16px;font-weight:600;margin:12px 0;transition:transform .2s,background .2s;}
.btn:hover{background:#e8550a;transform:translateY(-1px);}
.btn.secondary{background:var(--card);color:var(--brand);border:2px solid var(--brand);}
.dl{max-width:760px;margin:26px auto 0;padding:0 18px;}
.dl h2{font-size:18px;font-weight:800;text-align:center;margin-bottom:4px;}
